
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>お問い合わせフォーム</title>
  <style>
    :root {
      --primary-color: #0070f3;
      --primary-hover: #0051a2;
      --bg-color: #f7f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e1e4e8;
      --error-color: #e53e3e;
      --success-color: #38a169;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 480px;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
    }

    h2 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: #111;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: #666;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444;
    }

    input[type="text"],
    input[type="email"],
    textarea {
      width: 100%;
      padding: 10px 14px;
      font-size: 0.95rem;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus,
    input[type="email"]:focus,
    textarea:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(0, 112, 243, 0.15);
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    button {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      font-weight: 600;
      color: #ffffff;
      background-color: var(--primary-color);
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:disabled {
      background-color: #a0aec0;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.875rem;
      font-weight: 500;
      text-align: center;
      display: none;
    }

    #status.success {
      display: block;
      background-color: #e6fffa;
      color: var(--success-color);
      border: 1px solid #b2f5ea;
    }

    #status.error {
      display: block;
      background-color: #fff5f5;
      color: var(--error-color);
      border: 1px solid #fed7d7;
    }

    #status.loading {
      display: block;
      background-color: #ebf8ff;
      color: #3182ce;
      border: 1px solid #bee3f8;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>お問い合わせ</h2>
    <p class="subtitle">以下のフォームに入力して送信してください。</p>

    <form id="contactForm">
      <div class="form-group">
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" placeholder="山田 太郎" required>
      </div>

      <div class="form-group">
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="example@example.com" required>
      </div>

      <div class="form-group">
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" placeholder="ご自由にご記入ください" required></textarea>
      </div>

      <button type="submit" id="submitBtn">送信する</button>
    </form>

    <div id="status"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbx3LrFnfuEAENr9U6T7bkIJ1QIq6Ks5ebZIZu1x4BqpybWcQ9Xi2HKvMRimMITwHF7I/exec";

    const form = document.getElementById('contactForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      submitBtn.disabled = true;
showStatus('送信中... loading');

const formData = {
  name: document.getElementById('name').value,
  email: document.getElementById('email').value,
  message: document.getElementById('message').value
};

try {
  await fetch('/api/send', {   // ← Vercel の API Route に送る
    method: 'POST',
    headers: {
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(formData)
  });

  showStatus('送信が完了いたしました！ success');
  form.reset();
} catch (error) {
  console.error('Submission Error:', error);
  showStatus('送信中にエラーが発生しました。');
} finally {
  submitBtn.disabled = false;
}

    });

    function showStatus(message, type) {
      statusDiv.textContent = message;
      statusDiv.className = type;
    }
  </script>
</body>
</html>
